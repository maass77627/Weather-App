<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>

     <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <title>Weather App</title>

</head>
<body>

    <div class="clouds"></div>
 <div id="list-button" class="button">
    <i class="fa-solid fa-list"></i>
    </div>
    <h1 class="title">Weather App</h1>
    <!-- <button id="save-city">Save City</button> -->
    <!-- <input id="city-input" placeholder="Enter city" /> -->
<!-- <button id="search-btn">Search</button> -->
<div class="search-bar">
  <input id="city-input" placeholder="Enter city" />
  <button id="search-btn">
    <i class="fa-solid fa-magnifying-glass"></i>
  </button>

   <button id="save-city">
    <i class="fa-solid fa-bookmark"></i>
  </button>
</div>


    <div class="info">
        <h2 id="location" class="location"></h2>
        <h1 id="temp" class="temp"></h1>
        <span id="weather" class="weather"></span>
        <span id="highlow" class="highlow"></span>
    </div>

    <div class="current">
        <p class="details">weather details</p>
        <div id="weather-container" class="weather-container">
            <div class="card">
                <span id="time" class="time"></span>
                <img id="icon" class="icon"></img>
                <span id="temperature" class="temperature"></span>
           </div>
       </div>
    </div>

    <div class="forecast">
        <p>10-DAY FORECAST</p>
        <div id="days" class="days">
       </div>
   </div>
        
           
    <!-- </div> -->

<div class="airquality">
    <p>Air Quality</p>
    <h1 id="airquality-rating" class="airquality-rating"></h1>
    <h2 id="airquality-word" class="airquality-word"></h2>


    <div class="airquality-bar">
    <div class="airquality-indicator" id="airquality-indicator"></div>
    </div>
    <p id="airquality-description" class="airquality-description"></p>
   </div>

   <div class="precipitation">
        <p>Precipitation</p>

        <div id="map"></div>
   </div>


   <div class="div-wrap">

   <div  class="feels-like">
    <p>Feels Like</p>
    <h1 id="feels-like"></h1>
   </div>

   <div class="uv-index">
    <p>UV-index</p>
    <h1 id="uv-index"></h1>
    
   </div>

</div>

<div class="wind">
    <p>Wind</p>

 <div class="wind-wrap"> 
    <div class="row">
        <label>Wind</label>
        <span id="mph">data</span>
    </div>
    <div class="row">
        <label>Gusts</label>
        <span id="gusts">data</span>
    </div>
    <div class="row">
        <label>Direction</label>
        <span id="dir">data</span>
    </div>
 </div> 

    <div class="compass">
  <div class="compass-circle">
    <span class="north">N</span>
    <span class="east">E</span>
    <span class="south">S</span>
    <span class="west">W</span>

    <div id="wind-arrow">↑</div>
  </div>

  <p id="direction-label">N</p>
</div>





<div id="city-panel" class="city-panel hidden">
  <div class="city-panel-header">
    <h2>Saved Cities</h2>
    <button id="close-panel">✕</button>
  </div>

  <div id="panel-city-list" class="city-list"></div>
</div>


<footer class="footer">

    

    
</footer>

    <script src="js/index.js"></script>
</body>
</html>
